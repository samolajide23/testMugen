<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JSMugen compare bridge</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    display: flex; flex-direction: column;
  }
  #game { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #gamecanvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    width: 100%; height: 100%;
    max-width: 100%; max-height: 100%;
    object-fit: contain;
    background: #000;
  }
  #toolbar { display: none; }
  #status {
    position: absolute; left: 6px; bottom: 4px; right: 6px;
    color: #8b949e; font: 10px/1.3 Consolas, monospace;
    pointer-events: none; text-shadow: 0 0 4px #000;
  }
</style>
</head>
<body>
  <div id="game">
    <canvas id="gamecanvas" width="320" height="240"></canvas>
  </div>
  <div id="toolbar">
    <button id="btreset">RESET</button>
    <button id="btload">LOAD ZIP</button>
    <button id="btcolor">COLOR</button>
    <button id="btpower">POWER</button>
    <input type="file" id="zipfile" accept=".zip" />
    <input id="basevol" type="range" value="0" min="0" max="1" step="0.01" />
  </div>
  <div id="status">JSMugen loading…</div>
  <script>
    function reply(ev, payload, transfer) {
      const msg = Object.assign({ reqId: ev.data && ev.data.reqId }, payload);
      if (transfer && transfer.length) ev.source.postMessage(msg, "*", transfer);
      else ev.source.postMessage(msg, "*");
    }

    window.addEventListener("message", async (ev) => {
      const msg = ev.data;
      if (!msg || typeof msg !== "object") return;
      const B = window.JSMugenBridge;
      const status = document.getElementById("status");
      try {
        if (msg.type === "jsmugen-ping") {
          reply(ev, { type: "jsmugen-ready", ready: !!(B && B.ready()) });
          return;
        }
        if (!B) {
          if (msg.reqId) reply(ev, { type: "jsmugen-error", error: "JSMugen bridge not ready" });
          return;
        }
        if (msg.type === "jsmugen-load-zip" && msg.buffer) {
          status.textContent = "Loading char into JSMugen…";
          const blob = new Blob([msg.buffer], { type: "application/zip" });
          const ok = await B.loadBlob(blob);
          status.textContent = ok ? "JSMugen: char loaded" : "JSMugen: load failed";
          reply(ev, { type: "jsmugen-loaded", ok });
          return;
        }
        if (msg.type === "jsmugen-extract-air") {
          const air = B.extractAir();
          if (!air) {
            reply(ev, { type: "jsmugen-error", error: "No AIR on player — load a char first" });
            return;
          }
          status.textContent = `Extracted ${air.actionCount} AIR actions`;
          reply(ev, { type: "jsmugen-air", air });
          return;
        }
        if (msg.type === "jsmugen-extract-sprites") {
          const result = B.extractSprites(msg.keys || null);
          const n = Object.keys(result.sprites || {}).length;
          status.textContent = `Extracted ${n} sprites (JSMugen SFF)`;
          reply(ev, { type: "jsmugen-sprites", sprites: result.sprites }, result.transfer);
          return;
        }
        if (msg.type === "jsmugen-change-action") {
          const ok = B.changeAction(msg.actionId);
          status.textContent = ok
            ? `JSMugen action ${msg.actionId}${msg.label ? " · " + msg.label : ""}`
            : `JSMugen: no player / bad action ${msg.actionId}`;
          return;
        }
        if (msg.type === "jsmugen-reset") {
          if (B.clearCompareLock) B.clearCompareLock();
          B.reset();
          status.textContent = "JSMugen reset";
          return;
        }
        if (msg.type === "jsmugen-clsn") {
          B.setDrawClsn(!!msg.on);
          return;
        }
      } catch (err) {
        const text = err && err.message ? err.message : String(err);
        status.textContent = "JSMugen error: " + text;
        console.error(err);
        if (msg.reqId) reply(ev, { type: "jsmugen-error", error: text });
      }
    });
  </script>
  <script defer src="bundle.js"></script>
</body>
</html>
